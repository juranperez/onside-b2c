# Free 24/7 transfer-rumour ingestion trigger.
#
# Vercel Hobby caps cron frequency (~daily), so we drive the ingestion endpoint from
# GitHub Actions instead — free, every 30 minutes, independent of the Vercel plan.
# The endpoint (/api/cron/ingest-rumours) is CRON_SECRET-guarded and only ingests
# when RUMOUR_INGEST_ENABLED=1 on Vercel. Nothing publishes automatically — every
# item lands in the human review queue at /transfers/manage.
#
# One-time setup: add a repository secret CRON_SECRET (same value as the Vercel env).
#   Settings -> Secrets and variables -> Actions -> New repository secret.
# Optionally override the target with a repo variable INGEST_URL.

name: Ingest transfer rumours

on:
  schedule:
    - cron: "*/30 * * * *" # every 30 minutes (UTC)
  workflow_dispatch: {} # allow manual runs from the Actions tab

concurrency:
  group: ingest-rumours
  cancel-in-progress: false

jobs:
  ingest:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger ingestion endpoint
        env:
          INGEST_URL: ${{ vars.INGEST_URL || 'https://onsidemarket.com/api/cron/ingest-rumours' }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          if [ -z "$CRON_SECRET" ]; then
            echo "::error::CRON_SECRET repo secret is not set - add it under Settings > Secrets and variables > Actions."
            exit 1
          fi
          echo "Hitting $INGEST_URL"
          curl -sS --fail-with-body --max-time 115 -X GET "$INGEST_URL" \
            -H "Authorization: Bearer $CRON_SECRET"
